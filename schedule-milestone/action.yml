name: "schedule-milestone"
description: "An action that schedules a milestone, updating it if it already exists"
author: "jzheaux"
inputs:
  milestone-title:
    description: "The milestone to close"
    required: true
  milestone-date:
    description: "The milestone date"
    required: true
  milestone-description:
    description: "The milestone description"
    required: false
runs:
  using: "composite"
  steps:
    - id: schedule-milestone
      shell: bash
      run: |
        MILESTONE_ID=$(gh api repos/$GITHUB_REPOSITORY/milestones --jq '.[] | select(.title == "${{ inputs.milestone-title }}") | .number')
        if [ $MILESTONE_ID ]; then
          gh api -X PATCH repos/$GITHUB_REPOSITORY/milestones/$MILESTONE_ID \
            -f due_on='${MILESTONE_DATE}' \
            -f description='${MILESTONE_DESCRIPTION}' \
            --silent
        else
          gh api --method POST \
            -H 'Accept: application/vnd.github.v3+json' \
            /repos/$GITHUB_REPOSITORY/milestones \
            -f title='Milestone Title' \
            -f due_on='${MILESTONE_DATE}' \
            -f description='${MILESTONE_DESCRIPTION}'
        fi