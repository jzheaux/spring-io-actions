name: "run-maven"
description: "Run a Maven Command"
author: "jzheaux"

inputs:
  maven-args:
    description: "Maven arguments"
    required: true
  java-version:
    description: "Java version to use"
    required: false
    default: "17"
  distribution:
    description: "Java distribution to use"
    required: false
    default: "temurin"
  artifact-repository-url:
    description: "The artifact repository to use to resolve artifacts; uses the project's declared repos by default"
    required: false
  artifact-repository-username:
    description: "The artifact repository username; requires artifact-repository-url to be set"
    required: false
  artifact-repository-password:
    description: "The artifact repository password; requires artifact-repository-url and -username to be set"
    required: false

runs:
  using: "composite"
  steps:
  - name: Write settings.xml
    uses: ./src/write-settings-xml
    with:
      artifact-repository-url: ${{ inputs.artifact-repository-url }}
      artifact-repository-username: ${{ inputs.artifact-repository-username }}
      artifact-repository-password: ${{ inputs.artifact-repository-password }}
  - name: Set up JDK ${{ inputs.java-version }}
    uses: actions/setup-java@v3
    with:
      java-version: ${{ inputs.java-version }}
      distribution: ${{ inputs.distribution }}
  - name: Run with Maven
    shell: bash
    env:
      MAVEN_ARGS: ${{ inputs.maven-args }}
    run: ./mvnw $MAVEN_ARGS
