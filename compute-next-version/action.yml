name: "compute-next-version"
description: "An action that computes the next milestone release name and date"
author: "jzheaux"

inputs:
  milestone-title:
    description: "The current project version"
    required: true
  milestone-token:
    description: "The token needed to query project milestone information"
    required: true
  website-token:
    description: "The token needed to query spring-website-content for generation information"
    required: true

  milestone-repository:
    description: "The repository to query project milestone information"
    required: false
  project-slug:
    description: "The website content slug"
    required: false
  website-repository:
    description: "The repository for website content"
    required: false

outputs:
  next-version:
    description: "The next project version"
  next-version-date:
    description: "The scheduled date for the next project version"
  next-version-type:
    description: "The type of the next project version (for example, 'oss', 'enterprise')"

runs:
  using: "node20"
  main: '../dist/compute-next-version/main/index.js'
